<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Weaver - Travel Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.assistant .results {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
        }

        .message.assistant .results .result-item {
            padding: 8px;
            background: white;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 3px solid #667eea;
        }

        .chat-input {
            padding: 20px;
            background: #f9f9f9;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .chat-input button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .welcome-message p {
            margin-bottom: 10px;
        }

        .welcome-message .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .welcome-message .suggestion {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .welcome-message .suggestion:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>✈️ Trip Weaver</h1>
            <p>Your AI Travel Planner - Search flights & hotels</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message" id="welcomeMessage">
                <h2>Welcome to Trip Weaver!</h2>
                <p>I can help you find flights and hotels for your next trip.</p>
                <p>Try asking me:</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="sendSuggestion('Show me all flights')">All flights</div>
                    <div class="suggestion" onclick="sendSuggestion('Show me all hotels')">All hotels</div>
                    <div class="suggestion" onclick="sendSuggestion('Find flights from BOM to DEL')">Flights BOM→DEL</div>
                    <div class="suggestion" onclick="sendSuggestion('Hotels in Bangkok')">Hotels in Bangkok</div>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-input">
            <input
                type="text"
                id="messageInput"
                placeholder="Ask about flights or hotels..."
                autocomplete="off"
            >
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let conversationHistory = [];

        function sendSuggestion(text) {
            messageInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }

            addMessage(message, 'user');
            conversationHistory.push(message);

            messageInput.value = '';
            sendButton.disabled = true;
            typingIndicator.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory.slice(0, -1)
                    })
                });

                const data = await response.json();

                let responseText = data.response || 'No response received.';

                let resultsHtml = '';
                if (data.flights && data.flights.length > 0) {
                    resultsHtml += '<div class="results"><strong>Flights:</strong>';
                    data.flights.forEach(flight => {
                        const origin = typeof flight.origin === 'object' ? flight.origin.airport : flight.origin;
                        const dest = typeof flight.destination === 'object' ? flight.destination.airport : flight.destination;
                        resultsHtml += `
                            <div class="result-item">
                                <strong>${flight.airline} ${flight.flightNumber}</strong><br>
                                ${origin} → ${dest}<br>
                                ${flight.flightDate} | ${flight.departureTime} - ${flight.arrivalTime}<br>
                                ${flight.currency} ${flight.price} | ${flight.availableSeats} seats
                            </div>
                        `;
                    });
                    resultsHtml += '</div>';
                }

                if (data.hotels && data.hotels.length > 0) {
                    resultsHtml += '<div class="results"><strong>Hotels:</strong>';
                    data.hotels.forEach(hotel => {
                        const city = typeof hotel.city === 'object' ? hotel.city.name : hotel.city;
                        resultsHtml += `
                            <div class="result-item">
                                <strong>${hotel.name}</strong><br>
                                ${city} | ${hotel.stars || 'N/A'} stars<br>
                                ${hotel.currency} ${hotel.pricePerNight || hotel.price}/night
                            </div>
                        `;
                    });
                    resultsHtml += '</div>';
                }

                addMessage(responseText + resultsHtml, 'assistant');
                conversationHistory.push(responseText);

            } catch (error) {
                addMessage('Sorry, there was an error connecting to the server. Please try again.', 'assistant');
            }

            typingIndicator.style.display = 'none';
            sendButton.disabled = false;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = content;
            chatMessages.insertBefore(messageDiv, typingIndicator);
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
